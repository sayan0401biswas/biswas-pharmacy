  <script>
    const icon=(name)=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const navItems=[['dashboard','Overview','grid'],['inventory','Inventory','box'],['sales','New sale','cart'],['orders','Orders','receipt'],['customers','Customers','users'],['suppliers','Suppliers','truck'],['reports','Reports','chart'],['settings','Settings','settings']];
    let current='dashboard';
    let products=[
      {name:'Dolo 650 Tablet',brand:'Micro Labs',sku:'MED-001',category:'Pain relief',price:30,stock:148,expiry:'Dec 2026',status:'In stock',icon:'pill'},
      {name:'Cetirizine 10mg',brand:'Cipla',sku:'MED-002',category:'Allergy',price:22,stock:86,expiry:'Jan 2027',status:'In stock',icon:'pill'},
      {name:'Azithral 500 Tablet',brand:'Alembic',sku:'MED-003',category:'Antibiotic',price:112,stock:12,expiry:'Oct 2026',status:'Low stock',icon:'pill'},
      {name:'ORS Orange 21g',brand:'Electral',sku:'MED-004',category:'Wellness',price:24,stock:54,expiry:'May 2027',status:'In stock',icon:'bag'},
      {name:'Pantop 40 Tablet',brand:'Aristo',sku:'MED-005',category:'Digestive health',price:48,stock:8,expiry:'Nov 2026',status:'Low stock',icon:'pill'},
      {name:'Vicks VapoRub 25g',brand:'P&G',sku:'MED-006',category:'Cold & flu',price:78,stock:42,expiry:'Aug 2027',status:'In stock',icon:'bag'},

      {name:'Metformin 500mg',brand:'USV',sku:'MED-008',category:'Diabetes care',price:18,stock:3,expiry:'Sep 2026',status:'Low stock',icon:'pill'},

    ];
    let orders=[
      {id:'BP-DEMO-001',customer:'Demo customer',items:3,date:'Today, 11:42 AM',amount:248,status:'Completed'},
      {id:'BP-DEMO-002',customer:'Walk-in customer',items:2,date:'Today, 10:18 AM',amount:96,status:'Completed'},
      {id:'BP-DEMO-003',customer:'Demo customer',items:5,date:'Yesterday, 7:34 PM',amount:684,status:'Completed'},

    let customers=[{name:'Demo customer A',phone:'—',orders:12,spent:2480,last:'Today'},{name:'Demo customer B',phone:'—',orders:8,spent:4125,last:'Yesterday'},{name:'Demo customer C',phone:'—',orders:5,spent:1880,last:'Sep 24'},{name:'Demo customer D',phone:'—',orders:3,spent:765,last:'Sep 22'},{name:'Walk-in customer',phone:'—',orders:1,spent:96,last:'Today'}];
    let suppliers=[{name:'Demo wholesaler A',contact:'—',phone:'—',products:42,status:'Active'},{name:'Demo wholesaler B',contact:'—',phone:'—',products:28,status:'Active'},{name:'Demo wholesaler C',contact:'—',phone:'—',products:19,status:'Active'},{name:'Demo wholesaler D',contact:'—',phone:'—',products:11,status:'Pending'}];
    let cart=[];
    function saveData(key,value){try{localStorage.setItem('biswas-pharmacy-'+key,JSON.stringify(value))}catch(e){}}
    try{products=JSON.parse(localStorage.getItem('biswas-pharmacy-products'))||products;orders=JSON.parse(localStorage.getItem('biswas-pharmacy-orders'))||orders;customers=JSON.parse(localStorage.getItem('biswas-pharmacy-customers'))||customers;suppliers=JSON.parse(localStorage.getItem('biswas-pharmacy-suppliers'))||suppliers;cart=JSON.parse(localStorage.getItem('biswas-pharmacy-cart'))||cart}catch(e){}
    const money=n=>'₹'+Number(n).toLocaleString('en-IN');
    const pillStatus=s=>`<span class="pill ${s==='In stock'||s==='Completed'||s==='Active'?'green':s==='Low stock'||s==='Pending'?'orange':s==='Refunded'?'red':'blue'}">${s}</span>`;
    function setNav(){document.getElementById('sideNav').innerHTML=navItems.map(([id,label,ico])=>`<button class="nav-btn ${current===id?'active':''}" data-page="${id}">${icon(ico)}<span>${label}</span>${id==='orders'?'<span class="nav-count">5</span>':''}</button>`).join('');document.getElementById('mobileNav').innerHTML=navItems.slice(0,5).map(([id,label,ico])=>`<button data-page="${id}" class="${current===id?'active':''}">${icon(ico)}<span>${label}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));}
    function navigate(page){current=page;setNav();document.getElementById('crumb').textContent=navItems.find(i=>i[0]===page)?.[1]||'Overview';render();window.scrollTo({top:0,behavior:'smooth'});}
    function title(title,sub,action=''){return `<div class="welcome-row"><div><div class="eyebrow">BISWAS PHARMACY</div><h1 class="page-title">${title}</h1><div class="page-subtitle">${sub}</div></div><div class="actions">${action}</div></div>`}
    function actionButton(text,ico,fn,primary=false){return `<button class="btn ${primary?'btn-primary':''}" onclick="${fn}">${icon(ico)}<span>${text}</span></button>`}
    function dashboard(){return `${title('Good morning, Biswas Brothers 👋','Here’s what’s happening at your store today.',actionButton('Export report','download',"exportData()")+actionButton('New sale','plus',"navigate('sales')",true))}
      <section class="metrics">
        <div class="metric"><div class="metric-top"><div class="metric-label">Today’s sales</div><div class="metric-icon">${icon('rupee')}</div></div><div class="metric-value">₹8,450</div><div class="metric-foot"><span class="up">↑ 12.8%</span> <span>vs. yesterday</span></div></div>
        <div class="metric"><div class="metric-top"><div class="metric-label">Orders today</div><div class="metric-icon blue">${icon('receipt')}</div></div><div class="metric-value">36</div><div class="metric-foot"><span class="up">↑ 8.2%</span> <span>vs. yesterday</span></div></div>
        <div class="metric"><div class="metric-top"><div class="metric-label">Products in stock</div><div class="metric-icon orange">${icon('box')}</div></div><div class="metric-value">1,248</div><div class="metric-foot"><span class="down">12 items</span> <span>need restocking</span></div></div>
        <div class="metric"><div class="metric-top"><div class="metric-label">To be replenished</div><div class="metric-icon" style="background:#fff0ee;color:#d26158">${icon('clock')}</div></div><div class="metric-value">07</div><div class="metric-foot"><span class="down">3 medicines</span> <span>expiring soon</span></div></div>
      </section>
      <section class="dashboard-grid"><div class="panel"><div class="panel-head"><div><div class="panel-title">Sales overview</div><div class="panel-caption">Your store performance at a glance</div></div><select class="select-mini" onchange="toast('Showing '+this.value.toLowerCase())"><option>This week</option><option>This month</option><option>This year</option></select></div><div class="sales-chart"><svg viewBox="0 0 700 210" preserveAspectRatio="none" role="img" aria-label="Weekly sales trend"><defs><linearGradient id="areaFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#16876b" stop-opacity=".17"/><stop offset="1" stop-color="#16876b" stop-opacity="0"/></linearGradient></defs><line class="grid-line" x1="46" y1="25" x2="690" y2="25"/><line class="grid-line" x1="46" y1="69" x2="690" y2="69"/><line class="grid-line" x1="46" y1="113" x2="690" y2="113"/><line class="grid-line" x1="46" y1="157" x2="690" y2="157"/><text class="axis" x="3" y="28">₹10k</text><text class="axis" x="10" y="72">₹7.5k</text><text class="axis" x="10" y="116">₹5k</text><text class="axis" x="10" y="160">₹2.5k</text><path class="chart-fill" d="M55 128 C90 122 91 102 143 110 S202 126 244 91 S302 99 345 79 S404 101 446 62 S499 89 548 73 S605 48 674 39 L674 170 L55 170Z"/><path class="chart-line" d="M55 128 C90 122 91 102 143 110 S202 126 244 91 S302 99 345 79 S404 101 446 62 S499 89 548 73 S605 48 674 39"/><circle class="chart-point" cx="55" cy="128" r="4"/><circle class="chart-point" cx="143" cy="110" r="4"/><circle class="chart-point" cx="244" cy="91" r="4"/><circle class="chart-point" cx="345" cy="79" r="4"/><circle class="chart-point" cx="446" cy="62" r="4"/><circle class="chart-point" cx="548" cy="73" r="4"/><circle class="chart-point" cx="674" cy="39" r="4"/><text class="axis" x="50" y="195">Mon</text><text class="axis" x="138" y="195">Tue</text><text class="axis" x="239" y="195">Wed</text><text class="axis" x="340" y="195">Thu</text><text class="axis" x="441" y="195">Fri</text><text class="axis" x="543" y="195">Sat</text><text class="axis" x="667" y="195">Sun</text></svg></div></div>
        <div class="panel expiring-panel"><div class="panel-head"><div><div class="panel-title">Expiry alerts</div><div class="panel-caption">Keep an eye on these products</div></div><button class="view-all" onclick="navigate('inventory')">View all</button></div><div class="expiring-list">${[['Azithral 500 Tablet','Batch AZ24-081 · 12 units','Oct 2026','red'],['Pantop 40 Tablet','Batch PN25-102 · 8 units','Nov 2026',''],['Dolo 650 Tablet','Batch DL25-016 · 28 units','Dec 2026','']].map(x=>`<div class="expiry-row"><div class="product-pic">${icon('pill')}</div><div><div class="expiry-name">${x[0]}</div><div class="expiry-meta">${x[1]}</div></div><span class="expiry-tag ${x[3]}">${x[2]}</span></div>`).join('')}</div></div></section>
      <section class="bottom-grid"><div class="panel"><div class="panel-head"><div><div class="panel-title">Recent transactions</div><div class="panel-caption">The latest activity from your store</div></div><button class="view-all" onclick="navigate('orders')">View all orders</button></div>${ordersTable(orders.slice(0,4),false)}</div><div class="panel"><div class="panel-head"><div><div class="panel-title">Quick actions</div><div class="panel-caption">Common tasks, one tap away</div></div></div><div class="quick-actions"><button class="quick-action" onclick="navigate('sales')"><div class="quick-icon">${icon('cart')}</div><div><strong>New sale</strong><span>Start a bill</span></div></button><button class="quick-action" onclick="openProductModal()"><div class="quick-icon">${icon('plus')}</div><div><strong>Add product</strong><span>Update inventory</span></div></button><button class="quick-action" onclick="navigate('customers')"><div class="quick-icon">${icon('users')}</div><div><strong>Add customer</strong><span>Save customer details</span></div></button><button class="quick-action" onclick="exportData()"><div class="quick-icon">${icon('download')}</div><div><strong>Download report</strong><span>Export your sales</span></div></button></div></div></section>`}
    function inventory(){return `${title('Inventory','Manage your medicines, wellness products, stock levels and expiry dates.',actionButton('Add product','plus','openProductModal()',true))}<div class="page-toolbar"><div class="field-search">${icon('search')}<input id="inventorySearch" placeholder="Search by product, brand or SKU" oninput="filterInventory()"></div><select class="filter-select" id="stockFilter" onchange="filterInventory()"><option value="all">All stock levels</option><option>In stock</option><option>Low stock</option></select><select class="filter-select" onchange="toast('Category filter applied')"><option>All categories</option><option>Pain relief</option><option>Cold & flu</option><option>Wellness</option></select><button class="btn" onclick="exportData()">${icon('download')} Export</button></div><div class="panel table-panel" id="inventoryTable">${inventoryTable(products)}<div class="table-footer"><span>Showing <b id="inventoryCount">${products.length}</b> products</span><span>Updated just now</span></div></div>`}
    function inventoryTable(list){return `<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>Price</th><th>Stock</th><th>Expiry date</th><th>Status</th><th></th></tr></thead><tbody>${list.map(p=>`<tr><td><div style="display:flex;align-items:center;gap:9px"><div class="product-pic">${icon(p.icon)}</div><div>${p.name}<div class="expiry-meta">${p.brand}</div></div></div></td><td>${p.sku}</td><td>${p.category}</td><td>${money(p.price)}</td><td>${p.stock} units</td><td>${p.expiry}</td><td>${pillStatus(p.status)}</td><td><button class="table-actions" onclick="restock('${p.sku}')">Restock</button></td></tr>`).join('')}</tbody></table></div>`}
    function filterInventory(){let q=(document.getElementById('inventorySearch')?.value||'').toLowerCase(),f=document.getElementById('stockFilter')?.value||'all';let list=products.filter(p=>(p.name+p.brand+p.sku+p.category).toLowerCase().includes(q)&&(f==='all'||p.status===f));document.getElementById('inventoryTable').innerHTML=inventoryTable(list)+`<div class="table-footer"><span>Showing <b>${list.length}</b> products</span><span>Updated just now</span></div>`}
    function ordersTable(list,all=true){return `<div class="table-wrap"><table class="table"><thead><tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Date & time</th><th>Amount</th><th>Status</th>${all?'<th></th>':''}</tr></thead><tbody>${list.map(o=>`<tr><td>${o.id}</td><td>${o.customer}</td><td>${o.items} items</td><td>${o.date}</td><td>${money(o.amount)}</td><td>${pillStatus(o.status)}</td>${all?'<td><button class="table-actions" onclick="toast(\'Order details opened\')">Details</button></td>':''}</tr>`).join('')}</tbody></table></div>`}
    function ordersPage(){return `${title('Orders','Track your bills and completed transactions.',actionButton('Export orders','download','exportData()'))}<div class="page-toolbar"><div class="field-search">${icon('search')}<input placeholder="Search by order ID or customer" oninput="filterTable(this,'ordersTable')"></div><select class="filter-select" onchange="toast('Date range updated')"><option>Last 7 days</option><option>Last 30 days</option><option>This month</option></select><select class="filter-select" onchange="toast('Order status filter applied')"><option>All statuses</option><option>Completed</option><option>Refunded</option></select></div><div class="panel table-panel" id="ordersTable">${ordersTable(orders)}<div class="table-footer"><span>Showing <b>${orders.length}</b> orders</span><span>Total sales <b>${money(orders.filter(o=>o.status==='Completed').reduce((a,o)=>a+o.amount,0))}</b></span></div></div>`}
    function customersPage(){return `${title('Customers','Keep track of the people who shop at your pharmacy.',actionButton('Add customer','plus','openCustomerModal()',true))}<div class="page-toolbar"><div class="field-search">${icon('search')}<input placeholder="Search name or phone number" oninput="filterTable(this,'customersTable')"></div><button class="btn" onclick="exportData()">${icon('download')} Export</button></div><div class="panel table-panel" id="customersTable"><div class="table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Phone number</th><th>Total orders</th><th>Total spent</th><th>Last visit</th><th></th></tr></thead><tbody>${customers.map(c=>`<tr><td>${c.name}</td><td>${c.phone}</td><td>${c.orders}</td><td>${money(c.spent)}</td><td>${c.last}</td><td><button class="table-actions" onclick="toast('Customer profile opened')">View profile</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${customers.length} customers</span><span>Customer records stay on this device</span></div></div>`}
    function suppliersPage(){return `${title('Suppliers','Manage your distributors and the products they provide.',actionButton('Add supplier','plus','openSupplierModal()',true))}<div class="page-toolbar"><div class="field-search">${icon('search')}<input placeholder="Search suppliers" oninput="filterTable(this,'suppliersTable')"></div><button class="btn" onclick="exportData()">${icon('download')} Export</button></div><div class="panel table-panel" id="suppliersTable"><div class="table-wrap"><table class="table"><thead><tr><th>Supplier</th><th>Contact person</th><th>Phone number</th><th>Products</th><th>Status</th><th></th></tr></thead><tbody>${suppliers.map(s=>`<tr><td>${s.name}</td><td>${s.contact}</td><td>${s.phone}</td><td>${s.products} products</td><td>${pillStatus(s.status)}</td><td><button class="table-actions" onclick="toast('Supplier details opened')">View details</button></td></tr>`).join('')}</tbody></table></div><div class="table-footer"><span>${suppliers.length} suppliers</span><span>Supplier list</span></div></div>`}
    function salesPage(){return `${title('New sale','Add products to the bill and checkout your customer.', '')}<div class="pos-layout"><div class="panel"><div class="panel-head"><div><div class="panel-title">Select products</div><div class="panel-caption">Tap a product to add it to the bill</div></div><div class="field-search" style="max-width:210px">${icon('search')}<input id="catalogSearch" placeholder="Search products" oninput="filterCatalog()"></div></div><div class="catalog-grid" id="catalogGrid">${catalogCards(products)}</div></div><div class="panel cart-panel"><div class="cart-head"><div><div class="panel-title">Current bill</div><div class="panel-caption" id="cartCount">0 items in bill</div></div><button class="view-all" onclick="clearCart()">Clear</button></div><div class="cart-items" id="cartItems"></div><div class="cart-summary"><div class="sum-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div><div class="sum-row"><span>GST (included)</span><span id="cartTax">₹0</span></div><div class="sum-row total"><span>Total payable</span><span id="cartTotal">₹0</span></div><input class="customer-input" id="saleCustomer" placeholder="Customer name (optional)"><button class="btn btn-primary checkout" onclick="checkout()">Complete sale · <span id="checkoutAmount">₹0</span></button><div style="text-align:center;color:#99a49f;font-size:9px;margin-top:9px">Prescription required medicines should be sold against a valid prescription.</div></div></div></div>`}
    function catalogCards(list){return list.map(p=>`<button class="catalog-card" onclick="addToCart('${p.sku}')"><div class="product-pic">${icon(p.icon)}</div><div class="catalog-name">${p.name}</div><div class="catalog-brand">${p.brand} · ${p.category}</div><div class="catalog-bottom"><span class="catalog-price">${money(p.price)}</span><span class="catalog-stock">${p.stock} left</span></div></button>`).join('')}
    function filterCatalog(){let q=document.getElementById('catalogSearch').value.toLowerCase();document.getElementById('catalogGrid').innerHTML=catalogCards(products.filter(p=>(p.name+p.brand+p.category).toLowerCase().includes(q)))}
    function updateCart(){saveData('cart',cart);let el=document.getElementById('cartItems');if(!el)return;let count=cart.reduce((a,x)=>a+x.qty,0),total=cart.reduce((a,x)=>a+x.price*x.qty,0),tax=Math.round(total*5/105);document.getElementById('cartCount').textContent=`${count} item${count===1?'':'s'} in bill`;document.getElementById('cartSubtotal').textContent=money(total-tax);document.getElementById('cartTax').textContent=money(tax);document.getElementById('cartTotal').textContent=money(total);document.getElementById('checkoutAmount').textContent=money(total);el.innerHTML=cart.length?cart.map(x=>`<div class="cart-row"><div class="product-pic">${icon(x.icon)}</div><div class="cart-item-main"><div class="cart-item-name">${x.name}</div><div class="cart-item-price">${money(x.price)} each</div></div><div class="qty"><button onclick="changeQty('${x.sku}',-1)">−</button><span>${x.qty}</span><button onclick="changeQty('${x.sku}',1)">+</button></div></div>`).join(''):'<div class="cart-empty">Your bill is empty.<br>Add products to get started.</div>'}
    function addToCart(sku){let p=products.find(x=>x.sku===sku),line=cart.find(x=>x.sku===sku);if(!p)return;if((line?.qty||0)>=p.stock){toast(`Only ${p.stock} units are in stock`);return}if(line)line.qty++;else cart.push({...p,qty:1});updateCart();}
    function changeQty(sku,d){let l=cart.find(x=>x.sku===sku);if(l){l.qty+=d;if(l.qty<1)cart=cart.filter(x=>x.sku!==sku)}updateCart()}
    function clearCart(){cart=[];updateCart()}
    function checkout(){if(!cart.length){toast('Add a product to the bill first');return}let total=cart.reduce((a,x)=>a+x.price*x.qty,0),customer=document.getElementById('saleCustomer')?.value.trim()||'Walk-in customer';for(const item of cart){let product=products.find(p=>p.sku===item.sku);if(!product||product.stock<item.qty){toast(`Not enough stock for ${item.name}`);return}product.stock-=item.qty;product.status=product.stock<10?'Low stock':'In stock'}let record=customers.find(c=>c.name.toLowerCase()===customer.toLowerCase());if(record){record.orders++;record.spent+=total;record.last='Today'}else if(customer!=='Walk-in customer'){customers.unshift({name:customer,phone:'—',orders:1,spent:total,last:'Today'})}orders.unshift({id:'BP-'+new Date().toISOString().slice(2,10).replaceAll('-','')+'-'+String(orders.length+1).padStart(2,'0'),customer,items:cart.reduce((a,x)=>a+x.qty,0),date:'Today, '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),amount:total,status:'Completed'});saveData('products',products);saveData('customers',customers);saveData('orders',orders);cart=[];updateCart();toast('Sale completed · '+money(total));}
    function reportsPage(){return `${title('Reports','A clear picture of your pharmacy’s performance.',actionButton('Download report','download','exportData()'))}<div class="report-cards"><div class="report-card"><span>Gross sales</span><strong>₹1,84,520</strong><small>↑ 14.2% vs last month</small></div><div class="report-card"><span>Orders completed</span><strong>842</strong><small>↑ 9.6% vs last month</small></div><div class="report-card"><span>Average bill value</span><strong>₹219</strong><small>↑ 3.1% vs last month</small></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Sales performance</div><div class="panel-caption">Daily sales for the current week</div></div><select class="select-mini"><option>This week</option><option>This month</option></select></div><div class="sales-chart" style="height:280px">${document.querySelector('.sales-chart')?.innerHTML||`<div style="height:100%;display:grid;place-items:center;color:#91a09b;font-size:12px">Sales trend will appear here as you record sales.</div>`}</div></div><div class="panel section-spacer"><div class="panel-head"><div><div class="panel-title">Top selling products</div><div class="panel-caption">Most purchased this month</div></div></div>${inventoryTable([...products].sort((a,b)=>b.stock-a.stock).slice(0,4))}</div>`}
    function settingsPage(){return `${title('Settings','Manage your store profile, billing preferences and team access.') }<div class="settings-grid"><div class="panel settings-menu"><button class="settings-tab active">Store profile</button><button class="settings-tab" onclick="toast('Billing preferences opened')">Billing preferences</button><button class="settings-tab" onclick="toast('Team access opened')">Team access</button><button class="settings-tab" onclick="toast('Notifications opened')">Notifications</button></div><div class="panel settings-form"><div class="panel-title">Store information</div><div class="panel-caption" style="margin-bottom:18px">This information appears on bills and receipts.</div><div class="form-grid"><div class="form-field"><label>Store name</label><input value="Biswas Pharmacy"></div><div class="form-field"><label>Phone number</label><input placeholder="Add store phone number"></div><div class="form-field"><label>Email address</label><input placeholder="Add store email"></div><div class="form-field"><label>GSTIN</label><input placeholder="Enter your GSTIN"></div><div class="form-field"><label>Store address</label><input placeholder="Add store address"></div><div class="form-field"><label>Currency</label><select><option>Indian Rupee (₹ INR)</option></select></div></div><button class="btn btn-primary settings-save" onclick="toast('Store settings saved')">Save changes</button></div></div>`}
    function render(){const c=document.getElementById('content');const pages={dashboard,inventory,sales:salesPage,orders:ordersPage,customers:customersPage,suppliers:suppliersPage,reports:reportsPage,settings:settingsPage};c.innerHTML=(pages[current]||dashboard)();if(current==='sales')updateCart();}
    function toast(message){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.textContent=message;document.body.append(t);setTimeout(()=>t.remove(),2600)}
    function filterTable(input,id){let q=input.value.toLowerCase();let rows=document.querySelectorAll(`#${id} tbody tr`);rows.forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
    function exportData(){let data='Biswas Pharmacy report\nGenerated, '+new Date().toLocaleString('en-IN')+'\n\nRecent orders\n'+orders.map(o=>[o.id,o.customer,o.items,o.date,o.amount,o.status].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='biswas-pharmacy-report.csv';a.click();URL.revokeObjectURL(a.href);toast('Your report is ready to download')}
    function openModal(titleText,subtitle,fields,saveFn){let back=document.createElement('div');back.className='modal-backdrop';back.innerHTML=`<div class="modal"><h2>${titleText}</h2><p>${subtitle}</p><div class="modal-fields">${fields}</div><div class="modal-foot"><button class="btn" onclick="this.closest('.modal-backdrop').remove()">Cancel</button><button class="btn btn-primary" id="modalSave">Save details</button></div></div>`;document.body.append(back);back.querySelector('#modalSave').onclick=()=>saveFn(back)}
    function openProductModal(){openModal('Add a product','Add a medicine or wellness product to your inventory.',`<div class="form-field"><label>Product name</label><input id="mName" placeholder="e.g. Dolo 650 Tablet"></div><div class="form-grid"><div class="form-field"><label>Brand</label><input id="mBrand" placeholder="Brand name"></div><div class="form-field"><label>Category</label><input id="mCategory" placeholder="e.g. Pain relief"></div><div class="form-field"><label>Price (₹)</label><input id="mPrice" type="number" placeholder="0"></div><div class="form-field"><label>Stock quantity</label><input id="mStock" type="number" placeholder="0"></div></div>`,back=>{let name=back.querySelector('#mName').value.trim();if(!name){toast('Enter a product name');return}let brand=back.querySelector('#mBrand').value.trim()||'Generic',price=Number(back.querySelector('#mPrice').value)||0,stock=Number(back.querySelector('#mStock').value)||0;products.unshift({name,brand,sku:'MED-'+String(products.length+1).padStart(3,'0'),category:back.querySelector('#mCategory').value||'Other',price,stock,expiry:'Not set',status:stock<10?'Low stock':'In stock',icon:'pill'});saveData('products',products);back.remove();navigate('inventory');toast('Product added to inventory')})}
    function restock(sku){let p=products.find(x=>x.sku===sku);openModal('Restock product',`Add units to ${p.name}.`, `<div class="form-field"><label>Additional units</label><input id="restockCount" type="number" min="1" value="20"></div>`,back=>{let n=Number(back.querySelector('#restockCount').value)||0;p.stock+=n;p.status=p.stock<10?'Low stock':'In stock';saveData('products',products);back.remove();render();toast(`${p.name} restocked`)})}
    function openCustomerModal(){openModal('Add a customer','Save customer contact details for their next visit.',`<div class="form-field"><label>Customer name</label><input id="cName" placeholder="Full name"></div><div class="form-field"><label>Phone number</label><input id="cPhone" placeholder="+91"></div>`,back=>{let name=back.querySelector('#cName').value.trim();if(!name){toast('Enter a customer name');return}customers.unshift({name,phone:back.querySelector('#cPhone').value||'—',orders:0,spent:0,last:'Never'});saveData('customers',customers);back.remove();render();toast('Customer added')})}
    function openSupplierModal(){openModal('Add a supplier','Save a distributor to your supplier list.',`<div class="form-field"><label>Supplier name</label><input id="sName" placeholder="Company name"></div><div class="form-grid"><div class="form-field"><label>Contact person</label><input id="sContact" placeholder="Full name"></div><div class="form-field"><label>Phone number</label><input id="sPhone" placeholder="+91"></div></div>`,back=>{let name=back.querySelector('#sName').value.trim();if(!name){toast('Enter a supplier name');return}suppliers.unshift({name,contact:back.querySelector('#sContact').value||'—',phone:back.querySelector('#sPhone').value||'—',products:0,status:'Active'});saveData('suppliers',suppliers);back.remove();render();toast('Supplier added')})}
    document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){navigate('inventory');let inp=document.getElementById('inventorySearch');if(inp){inp.value=e.target.value;filterInventory()}}});
    setNav();render();
  </script>
</body>
</html>
